
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>uChat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    u-chat {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
  </style>

  <script async src="https://client.uchat.io/uchat.js"></script>
</head>

<body>
  <u-chat
    room="qoooang1"
    style="display:inline-block; width:100%; max-width:500px; height:100%;">
  </u-chat>
</body>
</html>
